services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ycgc}
      POSTGRES_USER: ${POSTGRES_USER:-ycgc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ycgc_local_password}
    ports:
      - "5433:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"

  backend:
    build: ./backend
    env_file: .env
    ports:
      - "8010:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8010
    ports:
      - "3010:3010"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    command: npm run dev

  celery_worker:
    build: ./backend
    env_file: .env
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    command: celery -A app.tasks.celery_app worker --loglevel=info -Q default --concurrency=2

  celery_intelligence_worker:
    build: ./backend
    env_file: .env
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    # One model request lane keeps costs and provider limits predictable,
    # without blocking the two discovery/verification processes above.
    command: celery -A app.tasks.celery_app worker --loglevel=info -Q intelligence --concurrency=1

  celery_beat:
    build: ./backend
    env_file: .env
    volumes:
      - ./backend:/app
    depends_on:
      redis:
        condition: service_started
    command: celery -A app.tasks.celery_app beat --loglevel=info
